<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Anthology | AbeSite</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="works-container">
        <header class="works-header">
            <div class="page-title-area">
                <img src="../images/common/nav-works.png" alt="Works" class="page-title-img">
            </div>
            <div class="back-link-container">
                <a href="../works.html">
                    <img src="../images/common/btn-return.png" alt="もどる" class="btn-return">
                </a>
            </div>
        </header>

        <article class="work-detail-content">
            
            <div class="work-title">
                <img src="../images/works/midnight_title.png" alt="Midnight Anthology" onerror="this.style.display='none'; this.parentNode.innerText='Midnight Anthology'">
            </div>

            <div class="work-description">
                <p>
                    仰々しい名前のアプリ。朝のベッドから抜け出せない時に考えたアプリです。<br>
                    自分がしたことが、文章として紡がれて、その日の物語が出来上がっていきます。<br>
                    その日の物語は午後11時以降完成します。<br>
                </p>
            </div>

            <div class="work-main-image">
                <img src="../images/works/midnight.png" alt="Midnight Anthology 画面">
            </div>

        </article>

        <footer>
            <small>&copy; 2026 AbeSite</small>
        </footer>
    </div>
